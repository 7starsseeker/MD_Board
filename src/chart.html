<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Stats - 图表窗口</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/chart.min.js"></script>
  <script src="charts.js"></script>
  <style>
    body {
      background: transparent;
      display: flex;
      align-items: flex-start;
      height: 100vh;
      padding: 3px;
      overflow: hidden;
    }
    .overlay {
      background: rgba(8, 8, 16, 0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
    }
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 4px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .title-bar .title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .title-bar .title-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .title-bar .title-actions button {
      background: none;
      border: none;
      color: #e8e8f0;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .title-bar .title-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .title-bar .title-actions .close-btn:hover { color: #ff4444; }

    .chart-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      -webkit-app-region: no-drag;
      padding: 0 8px 8px;
    }
    .chart-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      padding: 6px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .chart-slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .chart-slide.slide-in-right {
      transform: translateX(40px);
    }
    .chart-slide.slide-in-left {
      transform: translateX(-40px);
    }
    .chart-slide.active {
      transform: translateX(0);
    }
    .chart-slide .chart-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-bright);
      text-align: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .chart-slide .chart-sub {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .chart-slide .chart-body {
      flex: 1;
      display: flex;
      gap: 6px;
      min-height: 0;
      overflow: hidden;
    }
    .chart-slide .chart-canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      min-width: 0;
    }
    .chart-slide .chart-canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .chart-slide .chart-info {
      width: 130px;
      flex-shrink: 0;
      font-size: 10px;
      color: var(--text-dim);
      overflow-y: auto;
      max-height: 100%;
      display: none;
      padding: 2px 0;
    }
    .chart-slide .chart-info.active { display: block; }
    .chart-slide .chart-info .info-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      line-height: 1.4;
    }
    .chart-slide .chart-info .info-val {
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-bright);
    }
    .chart-slide .chart-info .info-label { color: var(--text-dim); }
    .chart-slide .chart-info .info-section {
      font-weight: 700;
      font-size: 10px;
      color: var(--accent);
      margin-top: 5px;
      padding-top: 3px;
      border-top: 1px solid var(--border);
    }
    .chart-slide .chart-info .info-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 2px 0;
    }
    .chart-slide .chart-info .info-bar-track {
      width: 60px;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .chart-slide .chart-info .info-bar-fill {
      height: 100%;
      border-radius: 2px;
    }
    .chart-slide .chart-info .info-bar-fill.green { background: #4cd964; }
    .chart-slide .chart-info .info-bar-fill.gold { background: #ffd700; }
    .chart-slide .chart-info .info-bar-fill.red { background: #ff3b30; }
    .chart-slide .chart-info .info-bar-fill.blue { background: #64c8ff; }
    .chart-slide .chart-info .info-val.good { color: #4cd964; }
    .chart-slide .chart-info .info-val.bad { color: #ff3b30; }
    .chart-slide .chart-info .info-val.warn { color: #ffc832; }
    .chart-slide .chart-info .info-val.info { color: #64c8ff; }
    .chart-slide .chart-info .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      margin-top: 3px;
    }
    .chart-slide .chart-info .info-table th {
      text-align: left;
      padding: 2px 3px;
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .chart-slide .chart-info .info-table td {
      padding: 2px 3px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      white-space: nowrap;
    }

    /* 概览大数字 */
    .hero-grid {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 6px;
      align-content: center;
    }
    .hero-grid .hero-box {
      width: calc(33% - 6px);
      text-align: center;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 10px 4px;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .hero-grid .hero-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .hero-grid .hero-box.total::before { background: linear-gradient(90deg, #ffc832, #ff8c00); }
    .hero-grid .hero-box.wins-box::before { background: linear-gradient(90deg, #4cd964, #34c759); }
    .hero-grid .hero-box.losses-box::before { background: linear-gradient(90deg, #ff3b30, #ff6b62); }
    .hero-grid .hero-box.draws-box::before { background: linear-gradient(90deg, #ffd700, #ffaa00); }
    .hero-grid .hero-box.rate-box::before { background: linear-gradient(90deg, #64c8ff, #5e5ce6); }
    .hero-grid .hero-box .hero-val {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1.3;
    }
    .hero-grid .hero-box .hero-lbl {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      letter-spacing: 0.3px;
    }
    .hero-grid .hero-box.total .hero-val { color: #ffc832; }
    .hero-grid .hero-box.wins-box .hero-val { color: #4cd964; }
    .hero-grid .hero-box.losses-box .hero-val { color: #ff3b30; }
    .hero-grid .hero-box.draws-box .hero-val { color: #ffd700; }
    .hero-grid .hero-box.rate-box .hero-val { color: #64c8ff; }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 8px 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .nav-bar .nav-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .nav-bar .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-bar .nav-indicator {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .nav-bar .nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-bar .nav-dot.active { background: var(--accent); transform: scale(1.3); }
    .nav-bar .nav-dot:hover { background: rgba(255,200,50,0.5); }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .empty-state .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="overlay" id="app">
    <!-- 标题栏 -->
    <div class="title-bar">
      <span class="title">📈 图表</span>
      <span style="font-size:11px;color:#e8e8f0;flex:1;text-align:center" id="chart-tr-label"></span>
      <div class="title-actions">
        <button id="btn-prev" title="上一个">◀</button>
        <button id="btn-next" title="下一个">▶</button>
        <button class="close-btn" id="btn-close" title="关闭">✕</button>
      </div>
    </div>

    <!-- 图表区域 -->
    <div class="chart-viewport" id="chart-viewport">
      <div class="empty-state" id="empty-state">
        <span class="emoji">📊</span>
        暂无数据<br>
        <span style="font-size:10px;opacity:0.6">录入对局后自动显示图表</span>
      </div>
    </div>

    <!-- 导航栏 -->
    <div class="nav-bar" id="nav-bar" style="display:none">
      <span class="nav-indicator" id="nav-indicator">1 / 8</span>
      <div id="nav-dots"></div>
    </div>
  </div>

  <script>
    (function() {
      var api = window.mdStats;
      if (!api) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff3b30">API 加载失败</div>'; return; }

      // ═══ 图表配置 ═══
      var CHART_DEFS = [
        { id: 'hero', label: '概览', sub: '数据总览', render: renderHero },
        { id: 'win-pie', label: '胜负分布', sub: '总对局胜负平异常占比', render: renderWinPie },
        { id: 'first-second', label: '先后手对比', sub: '先手 vs 后手胜负', render: renderFirstSecondBar },
        { id: 'handtrap', label: '手坑分布', sub: '各类手坑被吃次数（可同时发生）', render: renderHandtrapPie },
        { id: 'endboard', label: '先手终场', sub: '终场质量分布', render: renderEndboardPie },
        { id: 'breakboard', label: '后手突破', sub: '突破成功/失败/投降', render: renderBreakBoardPie },
        { id: 'coin', label: '硬币统计', sub: '硬币正反胜负分布', render: renderCoinPie },
        { id: 'coin-trend', label: '硬币胜率趋势', sub: '硬币正反累计胜率变化', render: renderCoinTrendLine },
        { id: 'coin-anomaly', label: '硬币异常检测', sub: '连正/连反异常 + 正反偏斜检测', render: renderCoinAnomaly },
        { id: 'deck-trend', label: '特定卡组胜率趋势', sub: '', render: renderDeckTrendLine },
        { id: 'deck-bar', label: '自用卡组胜率', sub: '各卡组胜率排行', render: renderDeckBar },
        { id: 'opp-deck-bar', label: '对战卡组胜率', sub: '对手卡组胜率排行', render: renderOppDeckBar },
        { id: 'streak', label: '连胜状态', sub: '当前连胜/连败', render: renderStreakGauge },
        { id: 'trend', label: '胜率趋势', sub: '累计胜率变化', render: renderWinTrendLine },
        { id: 'dealer-screwed', label: '被发牌员制裁情况', sub: '完全动不了、互卡次数统计', render: renderDealerScrewed },
        { id: 'handstate', label: '卡手原因', sub: '卡废件/卡同名牌/卡后手牌次数', render: renderHandStatePie },
        { id: 'mistake', label: '严重失误', sub: '失误频率与胜率', render: renderMistakeDoughnut },
        { id: 'opponent-t0', label: '对手T0动', sub: '被对手T0干扰统计', render: renderOpponentT0Doughnut },
        { id: 'opponent-ran', label: '吓跑对手', sub: '对手逃跑次数', render: renderOpponentRanGauge },
        { id: 'typhon', label: '提丰统计', sub: '提丰出场各方结果', render: renderTyphonPie },
        { id: 'disconnect', label: '掉线统计', sub: '掉线次数分布', render: renderDisconnectPie },
        { id: 'timeout', label: '超时统计', sub: '超时次数分布', render: renderTimeoutPie },
        { id: 'big-hand', label: '对手大牌', sub: '对手大牌哥次数', render: renderBigHandGauge },
        { id: 'deckout', label: '抽干牌组', sub: '抽干对手/自己统计', render: renderDeckOutChart },
        { id: 'ranked-stats', label: '晋级/保级赛', sub: '晋级赛与保级赛数据对比', render: renderRankedStats }
      ];

      var currentIndex = 0;
      var stats = null;

      // ═══ 构建图表 DOM ═══
      function buildSlides() {
        var vp = document.getElementById('chart-viewport');
        var empty = document.getElementById('empty-state');
        empty.style.display = 'none';

        CHART_DEFS.forEach(function(def, i) {
          var slide = document.createElement('div');
          slide.className = 'chart-slide' + (i === 0 ? ' active' : '');
          slide.id = 'slide-' + def.id;

          var label = document.createElement('div');
          label.className = 'chart-label';
          label.textContent = def.label;
          slide.appendChild(label);

          var sub = document.createElement('div');
          sub.className = 'chart-sub';
          sub.textContent = def.sub;
          slide.appendChild(sub);

          // 特定卡组趋势：添加卡组选择器
          var deckSel = null;
          if (def.id === 'deck-trend') {
            var selRow = document.createElement('div');
            selRow.style.cssText = 'display:flex;align-items:center;gap:6px;padding:2px 12px 6px';
            var selLabel = document.createElement('span');
            selLabel.style.cssText = 'font-size:11px;color:#c0c0d0';
            selLabel.textContent = '卡组：';
            selRow.appendChild(selLabel);
            deckSel = document.createElement('select');
            deckSel.id = 'deck-trend-selector';
            deckSel.style.cssText = 'font-size:11px;background:rgba(255,255,255,0.85);color:#1a1a2e;border:1px solid rgba(255,255,255,0.3);border-radius:4px;padding:2px 6px;flex:1;max-width:180px';
            deckSel.innerHTML = '<option value="">加载中...</option>';
            // 异步加载卡组列表
            api.getStats().then(function(st) {
              var decks = Object.keys(st.deckResults || {}).sort();
              deckSel.innerHTML = '<option value="">选择卡组</option>';
              decks.forEach(function(d) {
                var opt = document.createElement('option');
                opt.value = d; opt.textContent = d;
                deckSel.appendChild(opt);
              });
              if (decks.length > 0) { deckSel.value = decks[0]; deckSel.dispatchEvent(new Event('change')); }
            });
            deckSel.addEventListener('change', function() {
              updateDisplay(stats);
            });
            selRow.appendChild(deckSel);
            slide.appendChild(selRow);
          }

          // 图表主体：canvas + info 面板
          var body = document.createElement('div');
          body.className = 'chart-body';

          var wrap = document.createElement('div');
          wrap.className = 'chart-canvas-wrap';

          var canvas = document.createElement('canvas');
          canvas.id = 'chart-w-' + def.id;
          wrap.appendChild(canvas);
          body.appendChild(wrap);

          var info = document.createElement('div');
          info.className = 'chart-info';
          info.id = 'info-' + def.id;
          body.appendChild(info);

          slide.appendChild(body);
          vp.appendChild(slide);
        });

        // 导航圆点
        var dotsEl = document.getElementById('nav-dots');
        dotsEl.innerHTML = '';
        CHART_DEFS.forEach(function(def, i) {
          var dot = document.createElement('span');
          dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
          dot.dataset.index = i;
          dot.addEventListener('click', function() { goTo(parseInt(this.dataset.index)); });
          dotsEl.appendChild(dot);
        });
      }

      // ═══ 切换 ═══
      function goTo(index) {
        if (index < 0) index = CHART_DEFS.length - 1;
        if (index >= CHART_DEFS.length) index = 0;
        if (index === currentIndex) return;

        var direction = index > currentIndex ? 'right' : 'left';
        var oldIndex = currentIndex;
        currentIndex = index;

        var oldSlide = document.getElementById('slide-' + CHART_DEFS[oldIndex].id);
        var newSlide = document.getElementById('slide-' + CHART_DEFS[currentIndex].id);

        // 设置新 slide 的进入方向
        newSlide.className = 'chart-slide slide-in-' + direction;
        // 强制 reflow
        void newSlide.offsetWidth;
        newSlide.classList.add('active');
        newSlide.className = 'chart-slide active';

        oldSlide.className = 'chart-slide';
        oldSlide.classList.remove('active');

        updateNav();
        renderCurrentChart();
      }

      function next() { goTo(currentIndex + 1); }
      function prev() { goTo(currentIndex - 1); }

      function updateNav() {
        document.getElementById('nav-indicator').textContent = (currentIndex + 1) + ' / ' + CHART_DEFS.length;
        document.querySelectorAll('.nav-dot').forEach(function(dot, i) {
          dot.classList.toggle('active', i === currentIndex);
        });
      }

      // ═══ 渲染当前图表 ═══
      function renderCurrentChart() {
        if (!stats) return;
        var def = CHART_DEFS[currentIndex];
        var canvas = document.getElementById('chart-w-' + def.id);
        if (!canvas) return;
        var infoEl = document.getElementById('info-' + def.id);
        ChartManager.render('standalone-' + def.id, canvas, def.render, stats, { infoEl: infoEl });
      }

      function renderAllCharts() {
        if (!stats) return;
        // 只渲染当前活动图表，其余导航时按需渲染
        renderCurrentChart();
      }

      // ═══ 数据更新 ═══
      function updateDisplay(newStats) {
        stats = newStats;
        // 更新时间范围标签
        api.getTimeRange().then(async function(range) {
          var labels = { all: '', today: '[一天]', week: '[一整周]', month: '[一整月]', custom: '[自定义]' };
          var label = labels[range] || '';
          var selDate = await api.getSelectedDate();
          if (range === 'today') {
            if (selDate) {
              var today = new Date();
              var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
              label = selDate === todayStr ? selDate + '「今天」' : selDate;
            } else {
              label = '[一天]';
            }
          } else if (range === 'week') {
            var ref = selDate ? new Date(selDate) : new Date();
            var day = ref.getDay();
            var diff = (day === 0 ? 6 : day - 1);
            var ws = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - diff);
            var we = new Date(ws);
            we.setDate(we.getDate() + 6);
            var wsStr = ws.getFullYear() + '-' + String(ws.getMonth() + 1).padStart(2, '0') + '-' + String(ws.getDate()).padStart(2, '0');
            var weStr = we.getFullYear() + '-' + String(we.getMonth() + 1).padStart(2, '0') + '-' + String(we.getDate()).padStart(2, '0');
            // 判断是否当前周
            var now = new Date();
            var nd = now.getDay();
            var ndiff = (nd === 0 ? 6 : nd - 1);
            var nws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ndiff);
            var nwsStr = nws.getFullYear() + '-' + String(nws.getMonth() + 1).padStart(2, '0') + '-' + String(nws.getDate()).padStart(2, '0');
            label = wsStr + ' ~ ' + weStr + (wsStr === nwsStr ? '「本周」' : '');
          } else if (range === 'month') {
            var ref = selDate ? new Date(selDate) : new Date();
            var ms = new Date(ref.getFullYear(), ref.getMonth(), 1);
            var me = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
            var msStr = ms.getFullYear() + '-' + String(ms.getMonth() + 1).padStart(2, '0') + '-' + String(ms.getDate()).padStart(2, '0');
            var meStr = me.getFullYear() + '-' + String(me.getMonth() + 1).padStart(2, '0') + '-' + String(me.getDate()).padStart(2, '0');
            // 判断是否当前月
            var nms = new Date();
            var nmsStr = nms.getFullYear() + '-' + String(nms.getMonth() + 1).padStart(2, '0');
            label = msStr + ' ~ ' + meStr + (msStr.substring(0, 7) === nmsStr ? '「本月」' : '');
          } else if (range === 'custom') {
            var cr = await api.getCustomRange();
            if (cr.start && cr.end) label = cr.start + ' ~ ' + cr.end;
          }
          document.getElementById('chart-tr-label').textContent = label;
        });
        if (!stats || stats.total === 0) {
          document.getElementById('empty-state').style.display = '';
          document.querySelectorAll('.chart-slide').forEach(function(s) { s.style.display = 'none'; });
          document.getElementById('nav-bar').style.display = 'none';
          ChartManager.destroyAll();
          return;
        }

        document.getElementById('empty-state').style.display = 'none';
        document.querySelectorAll('.chart-slide').forEach(function(s) { s.style.display = ''; });
        document.getElementById('nav-bar').style.display = '';

        if (document.querySelectorAll('.chart-slide').length === 0) buildSlides();
        renderAllCharts();
        updateNav();
      }

      // ═══ 关闭 / 键盘 / 窗口调整 ═══
      document.getElementById('btn-close').addEventListener('click', function() { window.close(); });
      document.getElementById('btn-prev').addEventListener('click', prev);
      document.getElementById('btn-next').addEventListener('click', next);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
        else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
        else if (e.key === 'Escape') window.close();
      });

      window.addEventListener('resize', function() {
        if (stats && stats.total > 0) renderCurrentChart();
      });

      // ═══ 启动 ═══
      api.getStats().then(updateDisplay);
      api.onStatsUpdate(function() { api.getStats().then(updateDisplay); });
    })();
  </script>
</body>
</html>
