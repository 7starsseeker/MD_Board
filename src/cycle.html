<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Stats - 循环显示</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: transparent;
      display: flex;
      align-items: stretch;
      height: 100vh;
      padding: 3px;
      overflow: hidden;
      margin: 0;
    }
    .overlay {
      background: rgba(8, 8, 16, 0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
    }
    .cycle-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .cycle-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .cycle-slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .cycle-slide.slide-next {
      transform: translateX(50px);
    }
    .cycle-slide.slide-prev {
      transform: translateX(-50px);
    }
    .cycle-slide.active.slide-next,
    .cycle-slide.active.slide-prev {
      transform: translateX(0);
    }

    /* ── 各个统计项的样式 ── */
    .cycle-slide .big-value {
      font-size: 80px;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      text-align: center;
    }
    .cycle-slide .big-value .pct {
      font-size: 44px;
      color: var(--text-dim);
    }
    .cycle-slide .big-label {
      font-size: 22px;
      color: var(--text-dim);
      margin-top: 6px;
      text-align: center;
    }
    .cycle-slide .sub-line {
      font-size: 16px;
      color: #ffffff;
      margin-top: 3px;
      text-align: center;
    }

    .cycle-slide .double-row {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }
    .cycle-slide .double-row .col {
      text-align: center;
    }
    .cycle-slide .double-row .col .dv {
      font-size: 52px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .cycle-slide .double-row .col .dl {
      font-size: 16px;
      color: var(--text-dim);
    }

    .cycle-slide .triple-row {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .cycle-slide .triple-row .col {
      text-align: center;
      min-width: 60px;
    }
    .cycle-slide .triple-row .col .dv {
      font-size: 42px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .cycle-slide .triple-row .col .dl {
      font-size: 15px;
      color: #ffffff;
    }

    .cycle-slide .dots-line {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .cycle-slide .dots-line .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cycle-slide .dots-line .dot.win { background: #4cd964; }
    .cycle-slide .dots-line .dot.loss { background: #ff3b30; }
    .cycle-slide .dots-line .dot.draw { background: #ffd700; }
    .cycle-slide .dots-line .dot.abnormal {
      background: transparent;
      border: 2px solid #e8e8f0;
      position: relative;
      overflow: hidden;
    }
    .cycle-slide .dots-line .dot.abnormal::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, transparent 40%, #e8e8f0 40%, #e8e8f0 60%, transparent 60%);
    }
    .cycle-slide .dots-line .dot.empty { background: rgba(255,255,255,0.1); }

    /* ── 导航栏 ── */
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .title-bar .title {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
    }
    .title-bar .title-actions {
      display: flex;
      gap: 3px;
      -webkit-app-region: no-drag;
    }
    .title-bar .title-actions button {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .title-bar .title-actions button:hover { color: var(--text-dim); background: rgba(255,255,255,0.06); }
    .title-bar .title-actions .close-btn:hover { color: #ff4444; }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }
    .empty-state .emoji { font-size: 42px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title-bar">
      <span class="title">🔄 循环显示</span>
      <span style="font-size:11px;color:#e8e8f0;flex:1;text-align:center" id="cycle-time-range-label"></span>
      <div class="title-actions">
        <button id="btn-pause" title="暂停/继续">⏸</button>
        <button class="close-btn" id="btn-close" title="关闭">✕</button>
      </div>
    </div>
    <div class="cycle-viewport" id="viewport">
      <div class="empty-state" id="empty-state">
        <span class="emoji">🎴</span>暂无数据<br>
        <span style="font-size:14px;opacity:0.6">从控制面板选择要循环的统计项</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var api = window.mdStats;
      if (!api) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff3b30">API 加载失败</div>'; return; }

      var config = null;
      var stats = null;
      var currentIndex = 0;
      var timer = null;
      var paused = false;
      var currentTimeRange = 'all';
      var TIME_RANGE_LABELS = { all: '全部', today: '一天', week: '一整周', month: '一整月', custom: '自定义' };

      // ═══ 渲染函数 ▸ 返回 { label, subLabel, html } ═══

      var RENDERERS = {};

      RENDERERS.winRate = function(s) {
        // 最近 15 场胜负小圆点
        var dots = '';
        var hist = s.resultHistory || [];
        var lastN = Math.min(15, hist.length);
        for (var i = hist.length - lastN; i < hist.length; i++) {
          var r = hist[i];
          if (r !== 'win' && r !== 'loss') continue;
          var bg = r === 'win' ? '#4cd964' : '#ff3b30';
          var tc = r === 'win' ? '#000' : '#fff';
          dots += '<span style="display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;font-size:6px;font-weight:700;margin:1px;background:' + bg + ';color:' + tc + '">' + (r === 'win' ? 'W' : 'L') + '</span>';
        }
        return {
          label: s.winRate + '%',
          subLabel: s.wins + '胜 ' + s.losses + '负',
          valueColor: '#64c8ff',
          html: '<div class="big-value" style="color:#64c8ff">' + s.winRate + '<span class="pct">%</span></div>' +
                '<div class="big-label">总胜率</div>' +
                '<div class="sub-line">' + s.wins + '胜 ' + s.losses + '负 · ' + (s.wins + s.losses) + '局</div>' +
                '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin:3px 0 1px">' + dots + '</div>'
        };
      };

      RENDERERS.record = function(s) {
        return {
          label: s.wins + 'W - ' + s.losses + 'L',
          subLabel: '总场次 ' + s.total,
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + s.wins + '</div><div class="dl">胜场</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + s.losses + '</div><div class="dl">负场</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ffd700">' + s.draws + '</div><div class="dl">平局</div></div>' +
                  '<div class="col"><div class="dv" style="color:#e8e8f0">' + s.abnormals + '</div><div class="dl">异常</div></div>' +
                '</div>' +
                '<div class="big-label">胜负记录</div>' +
                '<div class="sub-line">总对局 ' + s.total + ' 场</div>'
        };
      };

      RENDERERS.firstSecond = function(s) {
        var gf = s.goingFirst, gs = s.goingSecond;
        var gfLossRate = gf.total > 0 ? (gf.losses / gf.total * 100).toFixed(1) : '0.0';
        var gsLossRate = gs.total > 0 ? (gs.losses / gs.total * 100).toFixed(1) : '0.0';
        return {
          label: '先手 ' + gf.winRate + '% / 后手 ' + gs.winRate + '%',
          subLabel: '先后手胜率对比',
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#4cd964;font-size:40px">' + gf.wins + '</div><div class="dl" style="font-size:13px">先手胜</div>' +
                  '<div style="font-size:13px;color:#64c8ff;font-weight:700">' + gf.winRate + '%</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30;font-size:40px">' + gf.losses + '</div><div class="dl" style="font-size:13px">先手负</div>' +
                  '<div style="font-size:13px;color:#ff6b62;font-weight:700">' + gfLossRate + '%</div></div>' +
                  '<div style="width:1px;height:50px;background:rgba(255,255,255,0.08)"></div>' +
                  '<div class="col"><div class="dv" style="color:#4cd964;font-size:40px">' + gs.wins + '</div><div class="dl" style="font-size:13px">后手胜</div>' +
                  '<div style="font-size:13px;color:#ff9632;font-weight:700">' + gs.winRate + '%</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30;font-size:40px">' + gs.losses + '</div><div class="dl" style="font-size:13px">后手负</div>' +
                  '<div style="font-size:13px;color:#ff6b62;font-weight:700">' + gsLossRate + '%</div></div>' +
                '</div>' +
                '<div class="big-label">先手 vs 后手</div>'
        };
      };

      RENDERERS.streak = function(s) {
        var st = s.currentStreak;
        if (!st || st.count === 0) {
          return {
            label: '—',
            subLabel: '暂无连胜/连败',
            html: '<div class="big-value" style="color:#e8e8f0">—</div><div class="big-label">暂无连胜</div>'
          };
        }
        var isWin = st.type === 'win';
        var color = isWin ? '#4cd964' : '#ff3b30';
        var emoji = isWin ? '🔥' : '💧';
        return {
          label: st.count + emoji,
          subLabel: isWin ? '连胜' : '连败',
          html: '<div class="big-value" style="color:' + color + '">' + st.count + ' <span style="font-size:50px">' + emoji + '</span></div>' +
                '<div class="big-label"' + (isWin ? '' : '') + '>' + (isWin ? '连胜中！' : '连败中...') + '</div>'
        };
      };

      RENDERERS.handtrapRate = function(s) {
        var ht = s.handtrap;
        var t = s.total;
        var laR = t > 0 ? (ht.gotLancea / t * 100).toFixed(1) : '0.0';
        var niR = t > 0 ? (ht.gotNibiru / t * 100).toFixed(1) : '0.0';
        var agR = ht.anyGRate || (t > 0 ? (ht.gotAnyG / t * 100).toFixed(1) : '0.0');
        return {
          label: '吃G率 ' + agR + '%',
          subLabel: '吃锁率 ' + laR + '%',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%;gap:2px">' +
                  '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px 10px;width:100%;max-width:300px">' +
                    '<div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#ffd700">' + fmt(agR) + '%</div><div style="font-size:12px;color:#ffffff">吃G率</div></div>' +
                    '<div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#64c8ff">' + fmt(laR) + '%</div><div style="font-size:12px;color:#ffffff">锁鸟</div></div>' +
                    '<div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#ff3b30">' + fmt(niR) + '%</div><div style="font-size:12px;color:#ffffff">陨石</div></div>' +
                  '</div>' +
                  '<div style="font-size:12px;color:#ffffff;text-align:center;margin-top:2px">增殖G ' + ht.gotMaxxc + ' · 鸟G ' + ht.gotDroll + ' · 水母G ' + ht.gotJellyfish + ' · 锁鸟 ' + ht.gotLancea + ' · 陨石 ' + ht.gotNibiru + ' · 大宇宙人 ' + ht.gotDimension + ' · 其他 ' + ht.gotSmallHT + '</div>' +
                '</div>' +
                '<div style="font-size:16px;color:var(--text-dim);margin-top:4px;text-align:center">手坑统计</div>'
        };
      };

      RENDERERS.coinRate = function(s) {
        var c = s.coin;
        return {
          label: c.winRate + '%',
          subLabel: '硬币胜 ' + c.wins + ' / 总 ' + c.total,
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#ffd700">' + fmt(c.winRate) + '%</div><div class="dl">硬币胜率</div></div>' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + c.wins + '</div><div class="dl">胜</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + c.losses + '</div><div class="dl">负</div></div>' +
                '</div>' +
                '<div class="big-label">硬币统计</div>'
        };
      };

      RENDERERS.totalMatches = function(s) {
        return {
          label: s.total + '',
          subLabel: '总对局数',
          html: '<div class="big-value" style="color:#ffc832">' + s.total + '</div>' +
                '<div class="big-label">总对局</div>' +
                '<div class="sub-line">胜率 ' + s.winRate + '%</div>'
        };
      };

      RENDERERS.opponentRan = function(s) {
        var or = s.opponentRan;
        if (!or || or.total === 0) {
          return {
            label: '0',
            subLabel: '还没吓跑过对手',
            html: '<div class="big-value" style="color:#e8e8f0">0</div><div class="big-label">还没吓跑过对手</div>'
          };
        }
        var best = or.byDeck && or.byDeck.length > 0 ? or.byDeck[0] : null;
        return {
          label: or.total + '',
          subLabel: '吓跑对手 ' + or.total + ' 次',
          html: '<div class="big-value" style="color:#ffd700">' + or.total + ' <span style="font-size:36px">🏃</span></div>' +
                '<div class="big-label">吓跑对手</div>' +
                '<div class="sub-line" style="font-size:14px">占总对局 ' + fmt(or.rate) + '%' +
                (best ? ' · 最多: ' + best.deck + ' (' + best.count + ')' : '') + '</div>'
        };
      };

      RENDERERS.endboard = function(s) {
        var eb = s.endboard;
        if (!eb || eb.total === 0) {
          return { label: '—', subLabel: '暂无先手对局', html: '<div class="big-value" style="color:#e8e8f0">—</div><div class="big-label">暂无先手数据</div>' };
        }
        var nP = (eb.normal / eb.total * 100).toFixed(1);
        var cP = (eb.compromised / eb.total * 100).toFixed(1);
        var sP = (eb.stopped / eb.total * 100).toFixed(1);
        var suP = (eb.surrender / eb.total * 100).toFixed(1);
        return {
          label: nP + '%',
          subLabel: '正常终场率',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%;gap:3px">' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;width:100%;max-width:280px">' +
                  '<div style="text-align:center"><div style="font-size:22px;font-weight:800;color:#4cd964">' + nP + '%</div><div style="font-size:12px;color:#ffffff">正常终场</div></div>' +
                  '<div style="text-align:center"><div style="font-size:22px;font-weight:800;color:#ffd700">' + cP + '%</div><div style="font-size:12px;color:#ffffff">妥协场</div></div>' +
                  '<div style="text-align:center"><div style="font-size:22px;font-weight:800;color:#ff3b30">' + sP + '%</div><div style="font-size:12px;color:#ffffff">没做出来</div></div>' +
                  '<div style="text-align:center"><div style="font-size:22px;font-weight:800;color:#e8e8f0">' + suP + '%</div><div style="font-size:12px;color:#ffffff">投降</div></div>' +
                '</div>' +
                '<div style="font-size:12px;color:#ffffff;text-align:center">共 ' + eb.total + ' 场先手 · 正常 ' + eb.normal + ' · 妥协 ' + eb.compromised + ' · 没做出来 ' + eb.stopped + ' · 投降 ' + eb.surrender + '</div>' +
                '</div>' +
                '<div style="font-size:16px;color:var(--text-dim);margin-top:4px;text-align:center">先手终场质量</div>'
        };
      };

      RENDERERS.breakBoard = function(s) {
        var bb = s.breakBoard;
        if (!bb || bb.total === 0) {
          return { label: '—', subLabel: '暂无后手对局', html: '<div class="big-value" style="color:#e8e8f0">—</div><div class="big-label">暂无后手数据</div>' };
        }
        var sr = parseFloat(bb.successRate) || 0;
        var swr = parseFloat(bb.successWinRate) || 0;
        return {
          label: sr + '%',
          subLabel: '突破成功率',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%">' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;width:100%;max-width:300px;margin-bottom:4px">' +
                  '<div style="text-align:center"><div style="font-size:32px;font-weight:800;color:#ff9632">' + fmt(bb.successRate) + '%</div><div style="font-size:13px;color:#ffffff">突破成功率</div></div>' +
                  '<div style="text-align:center"><div style="font-size:32px;font-weight:800;color:#64c8ff">' + fmt(bb.successWinRate) + '%</div><div style="font-size:13px;color:#ffffff">突破后胜率</div></div>' +
                '</div>' +
                '<div style="font-size:12px;color:#ffffff;text-align:center">共 ' + bb.total + ' 场后手 · 成功 ' + bb.success + ' · 失败 ' + bb.failed + ' · 投降 ' + bb.surrender + ' · 不需要 ' + bb.notNeeded + ' · 突破后胜 ' + bb.successWins + '</div>' +
                '</div>' +
                '<div class="big-label">后手突破统计</div>'
        };
      };

      RENDERERS.handState = function(s) {
        var hs = s.handState;
        var cp = parseFloat(hs.cantPlayRate) || 0;
        return {
          label: cp + '%',
          subLabel: '卡手率',
          html: '<div class="big-value" style="color:' + (cp > 20 ? '#ff3b30' : '#ffd700') + '">' + fmt(hs.cantPlayRate) + '<span class="pct">%</span></div>' +
                '<div class="big-label">卡手率</div>' +
                '<div class="sub-line">卡废件 ' + hs.cantPlayGarnet + ' · 卡同名牌 ' + hs.cantPlayDuplicate + ' · 卡后手牌 ' + hs.cantPlayHT + ' · 合计 ' + hs.totalCantPlay + ' 次</div>'
        };
      };

      RENDERERS.dealerScrewed = function(s) {
        var hs = s.handState;
        var total = (hs.cantPlay||0) + (hs.bothStuck||0);
        if (total === 0) {
          return { label: '0', subLabel: '暂无制裁记录', html: '<div class="big-value" style="color:#e8e8f0">0</div><div class="big-label">暂无制裁记录</div>' };
        }
        var cpRate = s.total > 0 ? ((hs.cantPlay||0) / s.total * 100).toFixed(1) : '0.0';
        var bsRate = s.total > 0 ? ((hs.bothStuck||0) / s.total * 100).toFixed(1) : '0.0';
        return {
          label: total + '',
          subLabel: '被制裁 ' + total + ' 次',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%;gap:2px">' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;width:100%;max-width:300px">' +
                  '<div style="text-align:center"><div style="font-size:36px;font-weight:800;color:#ff3b30">' + (hs.cantPlay||0) + '</div><div style="font-size:12px;color:#ffffff">完全动不了</div></div>' +
                  '<div style="text-align:center"><div style="font-size:36px;font-weight:800;color:#ff9f0a">' + (hs.bothStuck||0) + '</div><div style="font-size:12px;color:#ffffff">互卡</div></div>' +
                '</div>' +
                '<div style="font-size:12px;color:#ffffff;text-align:center;margin-top:2px">完全动不了率 ' + cpRate + '% · 互卡率 ' + bsRate + '%</div>' +
                '</div>' +
                '<div class="big-label">被发牌员制裁</div>'
        };
      };

      RENDERERS.mistake = function(s) {
        var m = s.mistake;
        if (!m || m.total === 0) {

      // ═══ 构建幻灯片 ═══
      function getEnabledItems() {
        if (!config || !config.items) return [];
        return config.items.filter(function(item) { return item.enabled; });
      }

      function buildSlides(items) {
        var vp = document.getElementById('viewport');
        var empty = document.getElementById('empty-state');

        // 清除旧 slides
        document.querySelectorAll('.cycle-slide').forEach(function(el) { el.remove(); });

        if (items.length === 0 || !stats || stats.total === 0) {
          empty.style.display = '';
          return;
        }
        empty.style.display = 'none';

        items.forEach(function(item, i) {
          var renderer = RENDERERS[item.type];
          if (!renderer) return;

          var slide = document.createElement('div');
          slide.className = 'cycle-slide' + (i === 0 ? ' active' : '');
          slide.id = 'cyc-slide-' + i;
          slide.innerHTML = renderer(stats, item).html;
          vp.appendChild(slide);
        });
      }

      // ═══ 循环逻辑 ═══
      function goTo(index, direction) {
        var items = getEnabledItems();
        if (items.length === 0) return;

        if (index < 0) index = items.length - 1;
        if (index >= items.length) index = 0;
        if (index === currentIndex && items.length > 1) return;

        var oldIndex = currentIndex;
        currentIndex = index;

        var dir = direction || (currentIndex > oldIndex ? 'next' : 'prev');

        var oldSlide = document.getElementById('cyc-slide-' + oldIndex);
        var newSlide = document.getElementById('cyc-slide-' + currentIndex);
        if (!newSlide) return;

        // 如果 oldSlide 不存在（第一次或重建后），直接激活
        if (!oldSlide) {
          newSlide.className = 'cycle-slide active';
          return;
        }

        var slideClass = dir === 'next' ? 'slide-next' : 'slide-prev';
        newSlide.className = 'cycle-slide ' + slideClass;
        void newSlide.offsetWidth; // force reflow

        oldSlide.className = 'cycle-slide';
        newSlide.classList.add('active');
        newSlide.className = 'cycle-slide active ' + slideClass;
        // 移除过渡 class
        requestAnimationFrame(function() {
          newSlide.className = 'cycle-slide active';
        });
      }

      function nextSlide() {
        var items = getEnabledItems();
        if (items.length === 0) return;
        goTo(currentIndex + 1, 'next');
      }

      function startTimer() {
        stopTimer();
        if (!config || paused) return;
        var duration = (config.duration || 5) * 1000;
        timer = setInterval(nextSlide, duration);
      }

      function stopTimer() {
        if (timer) { clearInterval(timer); timer = null; }
      }

      function restartTimer() {
        if (paused) return;
        startTimer();
      }

      // ═══ 暂停/继续 ═══
      function togglePause() {
        paused = !paused;
        document.getElementById('btn-pause').textContent = paused ? '▶' : '⏸';
        if (paused) { stopTimer(); }
        else { startTimer(); }
      }

      // ═══ 更新全部 ═══
      function updateDisplay(newStats) {
        stats = newStats;
        // 更新时间范围标签
        api.getTimeRange().then(async function(range) {
          currentTimeRange = range;
          var label = TIME_RANGE_LABELS[range] || '全部';
          var selDate = await api.getSelectedDate();
          if (range === 'today') {
            if (selDate) {
              var today = new Date();
              var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
              label = selDate === todayStr ? selDate + '「今天」' : selDate;
            } else {
              label = '[一天]';
            }
          } else if (range === 'week') {
            var ref = selDate ? new Date(selDate) : new Date();
            var day = ref.getDay();
            var diff = (day === 0 ? 6 : day - 1);
            var ws = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - diff);
            var we = new Date(ws);
            we.setDate(we.getDate() + 6);
            var wsStr = ws.getFullYear() + '-' + String(ws.getMonth() + 1).padStart(2, '0') + '-' + String(ws.getDate()).padStart(2, '0');
            var weStr = we.getFullYear() + '-' + String(we.getMonth() + 1).padStart(2, '0') + '-' + String(we.getDate()).padStart(2, '0');
            // 判断是否当前周
            var now = new Date();
            var nd = now.getDay();
            var ndiff = (nd === 0 ? 6 : nd - 1);
            var nws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ndiff);
            var nwsStr = nws.getFullYear() + '-' + String(nws.getMonth() + 1).padStart(2, '0') + '-' + String(nws.getDate()).padStart(2, '0');
            label = wsStr + ' ~ ' + weStr + (wsStr === nwsStr ? '「本周」' : '');
          } else if (range === 'month') {
            var ref = selDate ? new Date(selDate) : new Date();
            var ms = new Date(ref.getFullYear(), ref.getMonth(), 1);
            var me = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
            var msStr = ms.getFullYear() + '-' + String(ms.getMonth() + 1).padStart(2, '0') + '-' + String(ms.getDate()).padStart(2, '0');
            var meStr = me.getFullYear() + '-' + String(me.getMonth() + 1).padStart(2, '0') + '-' + String(me.getDate()).padStart(2, '0');
            // 判断是否当前月
            var nms = new Date();
            var nmsStr = nms.getFullYear() + '-' + String(nms.getMonth() + 1).padStart(2, '0');
            label = msStr + ' ~ ' + meStr + (msStr.substring(0, 7) === nmsStr ? '「本月」' : '');
          } else if (range === 'custom') {
            var cr = await api.getCustomRange();
            label = cr.start && cr.end ? cr.start + ' ~ ' + cr.end : '[自定义]';
          } else {
            label = '[' + label + ']';
          }
          document.getElementById('cycle-time-range-label').textContent = label;
        });
        var items = getEnabledItems();
        buildSlides(items);

        if (items.length === 0 || !stats || stats.total === 0) {
          stopTimer();
          return;
        }

        // 确保当前索引有效
        if (currentIndex >= items.length) currentIndex = 0;
        if (document.getElementById('cyc-slide-' + currentIndex)) {
          document.querySelectorAll('.cycle-slide').forEach(function(s) { s.classList.remove('active'); });
          var active = document.getElementById('cyc-slide-' + currentIndex);
          if (active) active.className = 'cycle-slide active';
        }

        startTimer();
      }

      // ═══ 配置更新 ═══
      function onConfigUpdated(newConfig) {
        config = newConfig;
        updateDisplay(stats);
      }

      // ═══ 格式化 ═══
      function fmt(v) {
        if (v === undefined || v === null) return '0.0';
        var n = typeof v === 'string' ? parseFloat(v) : v;
        return isNaN(n) ? '0.0' : n.toFixed(1);
      }

      // ═══ 绑定事件 ═══
      document.getElementById('btn-close').addEventListener('click', function() { window.close(); });
      document.getElementById('btn-pause').addEventListener('click', togglePause);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') { goTo(currentIndex - 1, 'prev'); restartTimer(); }
        else if (e.key === 'ArrowRight') { goTo(currentIndex + 1, 'next'); restartTimer(); }
        else if (e.key === ' ') { e.preventDefault(); togglePause(); }
        else if (e.key === 'Escape') { window.close(); }
      });

      // ═══ 启动 ═══
      api.getCycleConfig().then(function(cfg) {
        config = cfg;
        return api.getStats();
      }).then(function(s) {
        stats = s;
        updateDisplay(s);
      });

      api.onStatsUpdate(function() { api.getStats().then(updateDisplay); });
      api.onCycleConfigUpdate(onConfigUpdated);
    })();
  </script>
</body>
</html>
