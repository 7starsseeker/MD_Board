<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Stats - 循环显示</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: transparent;
      display: flex;
      align-items: stretch;
      height: 100vh;
      padding: 3px;
      overflow: hidden;
      margin: 0;
    }
    .overlay {
      background: rgba(8, 8, 16, 0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
    }
    .cycle-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .cycle-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .cycle-slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .cycle-slide.slide-next {
      transform: translateX(50px);
    }
    .cycle-slide.slide-prev {
      transform: translateX(-50px);
    }
    .cycle-slide.active.slide-next,
    .cycle-slide.active.slide-prev {
      transform: translateX(0);
    }

    /* ── 各个统计项的样式 ── */
    .cycle-slide .big-value {
      font-size: 80px;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      text-align: center;
    }
    .cycle-slide .big-value .pct {
      font-size: 44px;
      color: var(--text-dim);
    }
    .cycle-slide .big-label {
      font-size: 22px;
      color: var(--text-dim);
      margin-top: 6px;
      text-align: center;
    }
    .cycle-slide .sub-line {
      font-size: 16px;
      color: #a0a0b8;
      margin-top: 3px;
      text-align: center;
    }

    .cycle-slide .double-row {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }
    .cycle-slide .double-row .col {
      text-align: center;
    }
    .cycle-slide .double-row .col .dv {
      font-size: 52px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .cycle-slide .double-row .col .dl {
      font-size: 16px;
      color: var(--text-dim);
    }

    .cycle-slide .triple-row {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .cycle-slide .triple-row .col {
      text-align: center;
      min-width: 60px;
    }
    .cycle-slide .triple-row .col .dv {
      font-size: 42px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .cycle-slide .triple-row .col .dl {
      font-size: 15px;
      color: #a0a0b8;
    }

    .cycle-slide .dots-line {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .cycle-slide .dots-line .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cycle-slide .dots-line .dot.win { background: #4cd964; }
    .cycle-slide .dots-line .dot.loss { background: #ff3b30; }
    .cycle-slide .dots-line .dot.draw { background: #ffd700; }
    .cycle-slide .dots-line .dot.abnormal {
      background: transparent;
      border: 2px solid #8888a0;
      position: relative;
      overflow: hidden;
    }
    .cycle-slide .dots-line .dot.abnormal::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, transparent 40%, #8888a0 40%, #8888a0 60%, transparent 60%);
    }
    .cycle-slide .dots-line .dot.empty { background: rgba(255,255,255,0.1); }

    /* ── 导航栏 ── */
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .title-bar .title {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
    }
    .title-bar .title-actions {
      display: flex;
      gap: 3px;
      -webkit-app-region: no-drag;
    }
    .title-bar .title-actions button {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .title-bar .title-actions button:hover { color: var(--text-dim); background: rgba(255,255,255,0.06); }
    .title-bar .title-actions .close-btn:hover { color: #ff4444; }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }
    .empty-state .emoji { font-size: 42px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title-bar">
      <span class="title">🔄 循环显示</span>
      <div class="title-actions">
        <button id="btn-pause" title="暂停/继续">⏸</button>
        <button class="close-btn" id="btn-close" title="关闭">✕</button>
      </div>
    </div>
    <div class="cycle-viewport" id="viewport">
      <div class="empty-state" id="empty-state">
        <span class="emoji">🎴</span>暂无数据<br>
        <span style="font-size:14px;opacity:0.6">从控制面板选择要循环的统计项</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var api = window.mdStats;
      if (!api) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff3b30">API 加载失败</div>'; return; }

      var config = null;
      var stats = null;
      var currentIndex = 0;
      var timer = null;
      var paused = false;

      // ═══ 渲染函数 ▸ 返回 { label, subLabel, html } ═══

      var RENDERERS = {};

      RENDERERS.winRate = function(s) {
        return {
          label: s.winRate + '%',
          subLabel: s.wins + '胜 ' + s.losses + '负',
          valueColor: '#64c8ff',
          html: '<div class="big-value" style="color:#64c8ff">' + s.winRate + '<span class="pct">%</span></div>' +
                '<div class="big-label">总胜率</div>' +
                '<div class="sub-line">' + s.wins + '胜 ' + s.losses + '负 · ' + (s.wins + s.losses) + '局</div>'
        };
      };

      RENDERERS.record = function(s) {
        return {
          label: s.wins + 'W - ' + s.losses + 'L',
          subLabel: '总场次 ' + s.total,
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + s.wins + '</div><div class="dl">胜场</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + s.losses + '</div><div class="dl">负场</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ffd700">' + s.draws + '</div><div class="dl">平局</div></div>' +
                  '<div class="col"><div class="dv" style="color:#8888a0">' + s.abnormals + '</div><div class="dl">异常</div></div>' +
                '</div>' +
                '<div class="big-label">胜负记录</div>' +
                '<div class="sub-line">总对局 ' + s.total + ' 场</div>'
        };
      };

      RENDERERS.firstSecond = function(s) {
        var gf = s.goingFirst, gs = s.goingSecond;
        var gfLossRate = gf.total > 0 ? (gf.losses / gf.total * 100).toFixed(1) : '0.0';
        var gsLossRate = gs.total > 0 ? (gs.losses / gs.total * 100).toFixed(1) : '0.0';
        return {
          label: '先手 ' + gf.winRate + '% / 后手 ' + gs.winRate + '%',
          subLabel: '先后手胜率对比',
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + gf.wins + '</div><div class="dl">先手胜</div>' +
                  '<div style="font-size:15px;color:#64c8ff;font-weight:700">' + gf.winRate + '%</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + gf.losses + '</div><div class="dl">先手负</div>' +
                  '<div style="font-size:15px;color:#ff6b62;font-weight:700">' + gfLossRate + '%</div></div>' +
                  '<div style="width:1px;height:70px;background:rgba(255,255,255,0.08)"></div>' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + gs.wins + '</div><div class="dl">后手胜</div>' +
                  '<div style="font-size:15px;color:#ff9632;font-weight:700">' + gs.winRate + '%</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + gs.losses + '</div><div class="dl">后手负</div>' +
                  '<div style="font-size:15px;color:#ff6b62;font-weight:700">' + gsLossRate + '%</div></div>' +
                '</div>' +
                '<div class="big-label">先手 vs 后手</div>'
        };
      };

      RENDERERS.streak = function(s) {
        var st = s.currentStreak;
        if (!st || st.count === 0) {
          return {
            label: '—',
            subLabel: '暂无连胜/连败',
            html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label">暂无连胜</div>'
          };
        }
        var isWin = st.type === 'win';
        var color = isWin ? '#4cd964' : '#ff3b30';
        var emoji = isWin ? '🔥' : '💧';
        return {
          label: st.count + emoji,
          subLabel: isWin ? '连胜' : '连败',
          html: '<div class="big-value" style="color:' + color + '">' + st.count + ' <span style="font-size:50px">' + emoji + '</span></div>' +
                '<div class="big-label"' + (isWin ? '' : '') + '>' + (isWin ? '连胜中！' : '连败中...') + '</div>'
        };
      };

      RENDERERS.handtrapRate = function(s) {
        var ht = s.handtrap;
        var otherCount = ht.gotNibiru + ht.gotDimension + ht.gotSmallHT;
        var otherRate = s.total > 0 ? ((otherCount / s.total) * 100).toFixed(1) : '0.0';
        return {
          label: '吃G率 ' + ht.anyGRate + '%',
          subLabel: '吃锁率 ' + fmt(ht.lanceaRate || (s.total > 0 ? (ht.gotLancea / s.total * 100).toFixed(1) : '0.0')) + '%',
          html: '<div class="triple-row">' +
                  '<div class="col"><div class="dv" style="color:#ffd700">' + fmt(ht.anyGRate) + '%</div><div class="dl">吃G率</div></div>' +
                  '<div class="col"><div class="dv" style="color:#64c8ff">' + fmt(ht.lanceaRate || (s.total > 0 ? (ht.gotLancea / s.total * 100).toFixed(1) : '0.0')) + '%</div><div class="dl">吃锁率</div></div>' +
                  '<div class="col"><div class="dv" style="color:#8888a0">' + otherRate + '%</div><div class="dl">其他</div></div>' +
                '</div>' +
                '<div class="big-label">手坑统计</div>' +
                '<div class="sub-line">吃G ' + ht.gotAnyG + '次 · 锁鸟 ' + ht.gotLancea + '次 · 其他 ' + otherCount + '次（含陨石' + ht.gotNibiru + '次、大宇宙人' + ht.gotDimension + '次等）</div>'
        };
      };

      RENDERERS.coinRate = function(s) {
        var c = s.coin;
        return {
          label: c.winRate + '%',
          subLabel: '硬币胜 ' + c.wins + ' / 总 ' + c.total,
          html: '<div class="double-row">' +
                  '<div class="col"><div class="dv" style="color:#ffd700">' + fmt(c.winRate) + '%</div><div class="dl">硬币胜率</div></div>' +
                  '<div class="col"><div class="dv" style="color:#4cd964">' + c.wins + '</div><div class="dl">胜</div></div>' +
                  '<div class="col"><div class="dv" style="color:#ff3b30">' + c.losses + '</div><div class="dl">负</div></div>' +
                '</div>' +
                '<div class="big-label">硬币统计</div>'
        };
      };

      RENDERERS.totalMatches = function(s) {
        return {
          label: s.total + '',
          subLabel: '总对局数',
          html: '<div class="big-value" style="color:#ffc832">' + s.total + '</div>' +
                '<div class="big-label">总对局</div>' +
                '<div class="sub-line">胜率 ' + s.winRate + '%</div>'
        };
      };

      RENDERERS.opponentRan = function(s) {
        var or = s.opponentRan;
        if (!or || or.total === 0) {
          return {
            label: '0',
            subLabel: '还没吓跑过对手',
            html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">还没吓跑过对手</div>'
          };
        }
        var best = or.byDeck && or.byDeck.length > 0 ? or.byDeck[0] : null;
        return {
          label: or.total + '',
          subLabel: '吓跑对手 ' + or.total + ' 次',
          html: '<div class="big-value" style="color:#ffd700">' + or.total + ' 🏃</div>' +
                '<div class="big-label">吓跑对手</div>' +
                '<div class="sub-line">占总对局 ' + fmt(or.rate) + '%' +
                (best ? ' · 最多: ' + best.deck + ' (' + best.count + ')' : '') + '</div>'
        };
      };

      RENDERERS.endboard = function(s) {
        var eb = s.endboard;
        if (!eb || eb.total === 0) {
          return { label: '—', subLabel: '暂无先手对局', html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label">暂无先手数据</div>' };
        }
        var nP = (eb.normal / eb.total * 100).toFixed(1);
        return {
          label: nP + '%',
          subLabel: '正常终场率',
          html: '<div class="big-value" style="color:#4cd964">' + nP + '<span class="pct">%</span></div>' +
                '<div class="big-label">正常终场率</div>' +
                '<div class="sub-line">妥协 ' + eb.compromised + ' · 停牌 ' + eb.stopped + ' · 投降 ' + eb.surrender + '</div>'
        };
      };

      RENDERERS.breakBoard = function(s) {
        var bb = s.breakBoard;
        if (!bb || (bb.success + bb.failed) === 0) {
          return { label: '—', subLabel: '暂无后手对局', html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label">暂无后手数据</div>' };
        }
        var sr = (bb.success + bb.failed) > 0 ? (bb.success / (bb.success + bb.failed) * 100).toFixed(1) : '0.0';
        return {
          label: sr + '%',
          subLabel: '突破成功率',
          html: '<div class="big-value" style="color:#ff9632">' + sr + '<span class="pct">%</span></div>' +
                '<div class="big-label">后手突破成功率</div>' +
                '<div class="sub-line">成功 ' + bb.success + ' · 失败 ' + bb.failed + (bb.otk > 0 ? ' · OTK ' + bb.otk : '') + '</div>'
        };
      };

      RENDERERS.handState = function(s) {
        var hs = s.handState;
        var cp = parseFloat(hs.cantPlayRate) || 0;
        return {
          label: cp + '%',
          subLabel: '卡手率',
          html: '<div class="big-value" style="color:' + (cp > 20 ? '#ff3b30' : '#ffd700') + '">' + fmt(hs.cantPlayRate) + '<span class="pct">%</span></div>' +
                '<div class="big-label">卡手率</div>' +
                '<div class="sub-line">合计 ' + hs.totalCantPlay + ' 次（自己 ' + hs.cantPlay + ' · 互卡 ' + hs.bothStuck + '）</div>'
        };
      };

      RENDERERS.mistake = function(s) {
        var m = s.mistake;
        if (!m || m.total === 0) {
          return { label: '0', subLabel: '暂无严重失误', html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">暂无严重失误</div>' };
        }
        return {
          label: m.total + '',
          subLabel: '严重失误 ' + fmt(m.rate) + '%',
          html: '<div class="big-value" style="color:#ff6482">' + m.total + ' 💢</div>' +
                '<div class="big-label">严重失误统计</div>' +
                '<div class="sub-line">严重失误率 ' + fmt(m.rate) + '% · 严重失误时胜率 ' + fmt(m.winRate) + '%</div>'
        };
      };

      RENDERERS.opponentT0 = function(s) {
        var t0 = s.opponentT0;
        if (!t0 || t0.total === 0) {
          return { label: '0', subLabel: '暂无T0记录', html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">暂无对手T0</div>' };
        }
        return {
          label: t0.total + '',
          subLabel: '被T0 ' + t0.total + ' 次',
          html: '<div class="big-value" style="color:#ff2d55">' + t0.total + ' ⚡</div>' +
                '<div class="big-label">对手T0动</div>' +
                '<div class="sub-line">T0时胜率 ' + fmt(t0.winRate) + '% (' + t0.wins + '胜 ' + t0.losses + '负)</div>'
        };
      };

      RENDERERS.disconnect = function(s) {
        var con = s.connectivity;
        if (!con || con.disconnect === 0) {
          return { label: '0', subLabel: '暂无掉线', html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">暂无掉线</div>' };
        }
        return {
          label: con.disconnect + '',
          subLabel: '掉线率 ' + fmt(con.disconnectRate) + '%',
          html: '<div class="big-value" style="color:#8888a0">' + con.disconnect + ' 🔌</div>' +
                '<div class="big-label">掉线统计</div>' +
                '<div class="sub-line">自己掉线 ' + con.disconnectSelf + ' · 对手掉线 ' + con.disconnectOpponent + '</div>'
        };
      };

      RENDERERS.timeout = function(s) {
        var con = s.connectivity;
        if (!con || con.timeout === 0) {
          return { label: '0', subLabel: '暂无超时', html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">暂无超时</div>' };
        }
        return {
          label: con.timeout + '',
          subLabel: '超时率 ' + fmt(con.timeoutRate) + '%',
          html: '<div class="big-value" style="color:#ff9f0a">' + con.timeout + ' ⏰</div>' +
                '<div class="big-label">超时统计</div>' +
                '<div class="sub-line">自己超时 ' + con.timeoutSelf + ' · 对手超时 ' + con.timeoutOpponent + '</div>'
        };
      };

      RENDERERS.typhon = function(s) {
        var t = s.typhon;
        if (!t || t.total === 0) {
          return { label: '0', subLabel: '暂无提丰', html: '<div class="big-value" style="color:#8888a0">0</div><div class="big-label">暂无提丰登场</div>' };
        }
        var blackened = t.enemyBlack + t.selfBlack;
        var whitened = t.enemyWhite + t.selfWhite;
        return {
          label: t.total + '',
          subLabel: '提丰登场 ' + t.total + ' 次',
          html: '<div class="big-value" style="color:#af52de">' + t.total + ' 🐉</div>' +
                '<div class="big-label">提丰统计</div>' +
                '<div class="sub-line">🖤被黑 ' + blackened + ' · 🤍漂白 ' + whitened + '</div>'
        };
      };

      RENDERERS.myDeckStats = function(s) {
        var decks = s.myDeckStats;
        if (!decks || decks.length === 0) {
          return { label: '—', subLabel: '暂无卡组数据', html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label" style="font-size:16px">暂无卡组数据</div>' };
        }
        var top = decks.slice(0, 3);
        var list = top.map(function(d) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:290px;padding:4px 0;font-size:20px">' +
            '<span style="color:var(--text-bright)">' + d.deck + '</span>' +
            '<span><span style="color:#4cd964;font-weight:700;font-family:var(--font-mono)">' + d.wins + '</span>' +
            '<span style="color:var(--text-dim)">/</span>' +
            '<span style="color:#ff3b30;font-weight:700;font-family:var(--font-mono)">' + d.losses + '</span>' +
            ' <span style="font-weight:700;font-family:var(--font-mono);color:#64c8ff">' + d.winRate + '%</span></span></div>';
        }).join('');
        return {
          label: decks.length + ' 套卡组',
          subLabel: '自用卡组胜率',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%">' + list + '</div>' +
                '<div class="big-label" style="margin-top:4px;font-size:16px">自用卡组胜率</div>'
        };
      };

      RENDERERS.oppDeckStats = function(s) {
        var decks = s.deckStats;
        if (!decks || decks.length === 0) {
          return { label: '—', subLabel: '暂无对手卡组数据', html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label" style="font-size:16px">暂无对手数据</div>' };
        }
        var top = decks.slice(0, 3);
        var list = top.map(function(d) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:290px;padding:4px 0;font-size:20px">' +
            '<span style="color:var(--text-bright)">' + d.deck + '</span>' +
            '<span><span style="color:#4cd964;font-weight:700;font-family:var(--font-mono)">' + d.wins + '</span>' +
            '<span style="color:var(--text-dim)">/</span>' +
            '<span style="color:#ff3b30;font-weight:700;font-family:var(--font-mono)">' + d.losses + '</span>' +
            ' <span style="font-weight:700;font-family:var(--font-mono);color:#64c8ff">' + d.winRate + '%</span></span></div>';
        }).join('');
        return {
          label: decks.length + ' 种对手',
          subLabel: '对战卡组胜率',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%">' + list + '</div>' +
                '<div class="big-label" style="margin-top:4px;font-size:16px">对战卡组胜率</div>'
        };
      };

      RENDERERS.matchupStats = function(s) {
        var matchups = s.matchupStats;
        if (!matchups || matchups.length === 0) {
          return { label: '—', subLabel: '暂无交叉数据', html: '<div class="big-value" style="color:#8888a0">—</div><div class="big-label" style="font-size:16px">暂无交叉数据</div>' };
        }
        var top = matchups.slice(0, 3);
        var list = top.map(function(m) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:290px;padding:4px 0;font-size:20px">' +
            '<span style="color:var(--text-bright)">' + m.myDeck + '</span>' +
            '<span style="color:var(--text-dim)">vs</span>' +
            '<span style="color:var(--text)">' + m.opponentDeck + '</span>' +
            ' <span style="font-weight:700;font-family:var(--font-mono);color:#64c8ff">' + m.winRate + '%</span></span></div>';
        }).join('');
        return {
          label: matchups.length + ' 组对阵',
          subLabel: '自用 vs 对手交叉胜率',
          html: '<div style="display:flex;flex-direction:column;align-items:center;width:100%">' + list + '</div>' +
                '<div class="big-label" style="margin-top:4px;font-size:16px">对阵交叉统计</div>'
        };
      };

      // ═══ 构建幻灯片 ═══
      function getEnabledItems() {
        if (!config || !config.items) return [];
        return config.items.filter(function(item) { return item.enabled; });
      }

      function buildSlides(items) {
        var vp = document.getElementById('viewport');
        var empty = document.getElementById('empty-state');

        // 清除旧 slides
        document.querySelectorAll('.cycle-slide').forEach(function(el) { el.remove(); });

        if (items.length === 0 || !stats || stats.total === 0) {
          empty.style.display = '';
          return;
        }
        empty.style.display = 'none';

        items.forEach(function(item, i) {
          var renderer = RENDERERS[item.type];
          if (!renderer) return;

          var slide = document.createElement('div');
          slide.className = 'cycle-slide' + (i === 0 ? ' active' : '');
          slide.id = 'cyc-slide-' + i;
          slide.innerHTML = renderer(stats).html;
          vp.appendChild(slide);
        });
      }

      // ═══ 循环逻辑 ═══
      function goTo(index, direction) {
        var items = getEnabledItems();
        if (items.length === 0) return;

        if (index < 0) index = items.length - 1;
        if (index >= items.length) index = 0;
        if (index === currentIndex && items.length > 1) return;

        var oldIndex = currentIndex;
        currentIndex = index;

        var dir = direction || (currentIndex > oldIndex ? 'next' : 'prev');

        var oldSlide = document.getElementById('cyc-slide-' + oldIndex);
        var newSlide = document.getElementById('cyc-slide-' + currentIndex);
        if (!newSlide) return;

        // 如果 oldSlide 不存在（第一次或重建后），直接激活
        if (!oldSlide) {
          newSlide.className = 'cycle-slide active';
          return;
        }

        var slideClass = dir === 'next' ? 'slide-next' : 'slide-prev';
        newSlide.className = 'cycle-slide ' + slideClass;
        void newSlide.offsetWidth; // force reflow

        oldSlide.className = 'cycle-slide';
        newSlide.classList.add('active');
        newSlide.className = 'cycle-slide active ' + slideClass;
        // 移除过渡 class
        requestAnimationFrame(function() {
          newSlide.className = 'cycle-slide active';
        });
      }

      function nextSlide() {
        var items = getEnabledItems();
        if (items.length === 0) return;
        goTo(currentIndex + 1, 'next');
      }

      function startTimer() {
        stopTimer();
        if (!config || paused) return;
        var duration = (config.duration || 5) * 1000;
        timer = setInterval(nextSlide, duration);
      }

      function stopTimer() {
        if (timer) { clearInterval(timer); timer = null; }
      }

      function restartTimer() {
        if (paused) return;
        startTimer();
      }

      // ═══ 暂停/继续 ═══
      function togglePause() {
        paused = !paused;
        document.getElementById('btn-pause').textContent = paused ? '▶' : '⏸';
        if (paused) { stopTimer(); }
        else { startTimer(); }
      }

      // ═══ 更新全部 ═══
      function updateDisplay(newStats) {
        stats = newStats;
        var items = getEnabledItems();
        buildSlides(items);

        if (items.length === 0 || !stats || stats.total === 0) {
          stopTimer();
          return;
        }

        // 确保当前索引有效
        if (currentIndex >= items.length) currentIndex = 0;
        if (document.getElementById('cyc-slide-' + currentIndex)) {
          document.querySelectorAll('.cycle-slide').forEach(function(s) { s.classList.remove('active'); });
          var active = document.getElementById('cyc-slide-' + currentIndex);
          if (active) active.className = 'cycle-slide active';
        }

        startTimer();
      }

      // ═══ 配置更新 ═══
      function onConfigUpdated(newConfig) {
        config = newConfig;
        updateDisplay(stats);
      }

      // ═══ 格式化 ═══
      function fmt(v) {
        if (v === undefined || v === null) return '0.0';
        var n = typeof v === 'string' ? parseFloat(v) : v;
        return isNaN(n) ? '0.0' : n.toFixed(1);
      }

      // ═══ 绑定事件 ═══
      document.getElementById('btn-close').addEventListener('click', function() { window.close(); });
      document.getElementById('btn-pause').addEventListener('click', togglePause);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') { goTo(currentIndex - 1, 'prev'); restartTimer(); }
        else if (e.key === 'ArrowRight') { goTo(currentIndex + 1, 'next'); restartTimer(); }
        else if (e.key === ' ') { e.preventDefault(); togglePause(); }
        else if (e.key === 'Escape') { window.close(); }
      });

      // ═══ 启动 ═══
      api.getCycleConfig().then(function(cfg) {
        config = cfg;
        return api.getStats();
      }).then(function(s) {
        stats = s;
        updateDisplay(s);
      });

      api.onStatsUpdate(function() { api.getStats().then(updateDisplay); });
      api.onCycleConfigUpdate(onConfigUpdated);
    })();
  </script>
</body>
</html>
