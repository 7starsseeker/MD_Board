<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Stats - 显示窗口</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: transparent;
      display: flex;
      align-items: flex-start;
      height: 100vh;
      padding: 4px;
    }
    .overlay {
      background: rgba(8, 8, 16, 0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
    }
    .close-btn {
      position: absolute;
      top: 0; right: 4px;
      background: none;
      border: none;
      color: #e8e8f0;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 5px;
      line-height: 1;
      -webkit-app-region: no-drag;
      opacity: 0.4;
      z-index: 10;
    }
    .close-btn:hover { opacity: 1; color: #ff4444; }

    .stats-wrap {
      padding: 12px 14px;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100%;
    }

    .coin-row {
      font-size: 14px;
      color: #ffffff;
      margin-bottom: 4px;
      text-align: center;
    }
    .coin-row .coin-label { opacity: 0.8; }
    .coin-row .coin-val { color: #ffd866; font-weight: 700; font-family: var(--font-mono); }

    .wl-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin-bottom: 3px;
    }
    .wl-record {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
      font-family: var(--font-mono);
    }
    .wl-record .wins { color: #4cd964; }
    .wl-record .losses { color: #ff3b30; }
    .wl-record .sep { color: #ffffff; margin: 0 3px; }
    .wl-record .abnormals { color: #e8e8f0; }
    .wl-record .draws { color: #ffd700; }
    .wl-rate {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      font-family: var(--font-mono);
    }
    .wl-rate .pct { color: #e8e8f0; font-size: 14px; }

    .detail-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .detail-row .item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .detail-row .item .lbl { color: #ffffff; opacity: 0.85; }
    .detail-row .item .v { color: #ffffff; font-weight: 700; font-family: var(--font-mono); }

    .dots-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      align-items: center;
    }
    .dots-row .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .dots-row .dot.win { background: #4cd964; }
    .dots-row .dot.loss { background: #ff3b30; }
    .dots-row .dot.draw {
      background: #ffd700;
    }
    .dots-row .dot.abnormal {
      background: transparent;
      border: 2px solid #e8e8f0;
      position: relative;
      overflow: hidden;
    }
    .dots-row .dot.abnormal::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, transparent 40%, #e8e8f0 40%, #e8e8f0 60%, transparent 60%);
    }
    .dots-row .dot.empty { background: rgba(255,255,255,0.1); }
    .dots-row .dot-label {
      font-size: 11px;
      color: #ffffff;
      margin-left: 4px;
    }

    .empty-state {
      padding: 16px 12px;
      text-align: center;
      color: #ffffff;
      font-size: 13px;
    }
    .empty-state .emoji { font-size: 22px; display: block; margin-bottom: 4px; }
    .tr-label { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #e8e8f0; -webkit-app-region: no-drag; z-index: 5; }
  </style>
</head>
<body>
  <div class="overlay" id="app">
    <button class="close-btn" id="btn-close" title="关闭">✕</button>
    <span class="tr-label" id="tr-label"></span>
    <div id="content" class="stats-wrap">
      <div class="empty-state"><span class="emoji">⏳</span>加载中...</div>
    </div>
  </div>

  <script>
    (function() {
      var api = window.mdStats;
      if (!api) { document.getElementById('content').innerHTML = '<div class="empty-state">API 加载失败</div>'; return; }

      function render(stats) {
        var el = document.getElementById('content');
        // 更新时间范围标签
        api.getTimeRange().then(async function(range) {
          var labels = { all: '', today: '[一天]', week: '[一整周]', month: '[一整月]', custom: '[自定义]' };
          var label = labels[range] || '';
          var selDate = await api.getSelectedDate();
          if (range === 'today') {
            if (selDate) {
              var today = new Date();
              var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
              label = selDate === todayStr ? selDate + '「今天」' : selDate;
            } else {
              label = '[一天]';
            }
          } else if (range === 'week') {
            var ref = selDate ? new Date(selDate) : new Date();
            var day = ref.getDay();
            var diff = (day === 0 ? 6 : day - 1);
            var ws = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - diff);
            var we = new Date(ws);
            we.setDate(we.getDate() + 6);
            var wsStr = ws.getFullYear() + '-' + String(ws.getMonth() + 1).padStart(2, '0') + '-' + String(ws.getDate()).padStart(2, '0');
            var weStr = we.getFullYear() + '-' + String(we.getMonth() + 1).padStart(2, '0') + '-' + String(we.getDate()).padStart(2, '0');
            // 判断是否当前周
            var now = new Date();
            var nd = now.getDay();
            var ndiff = (nd === 0 ? 6 : nd - 1);
            var nws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ndiff);
            var nwsStr = nws.getFullYear() + '-' + String(nws.getMonth() + 1).padStart(2, '0') + '-' + String(nws.getDate()).padStart(2, '0');
            label = wsStr + ' ~ ' + weStr + (wsStr === nwsStr ? '「本周」' : '');
          } else if (range === 'month') {
            var ref = selDate ? new Date(selDate) : new Date();
            var ms = new Date(ref.getFullYear(), ref.getMonth(), 1);
            var me = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
            var msStr = ms.getFullYear() + '-' + String(ms.getMonth() + 1).padStart(2, '0') + '-' + String(ms.getDate()).padStart(2, '0');
            var meStr = me.getFullYear() + '-' + String(me.getMonth() + 1).padStart(2, '0') + '-' + String(me.getDate()).padStart(2, '0');
            // 判断是否当前月
            var nms = new Date();
            var nmsStr = nms.getFullYear() + '-' + String(nms.getMonth() + 1).padStart(2, '0');
            label = msStr + ' ~ ' + meStr + (msStr.substring(0, 7) === nmsStr ? '「本月」' : '');
          } else if (range === 'custom') {
            var cr = await api.getCustomRange();
            if (cr.start && cr.end) label = cr.start + ' ~ ' + cr.end;
          }
          document.getElementById('tr-label').textContent = label;
        });
        if (!stats || stats.total === 0) {
          el.innerHTML = '<div class="empty-state"><span class="emoji">🎴</span>暂无对局数据<br><span style="font-size:10px;opacity:0.6">打开控制面板录入</span></div>';
          return;
        }

        var c = stats.coin;
        var coinRow = stats.total > 0
          ? '<div class="coin-row"><span class="coin-label">硬币 </span><span class="coin-val">' + c.wins + '-' + c.losses + '</span> <span class="coin-label">(' + c.winRate + '%)</span></div>'
          : '';

        var gf = stats.goingFirst, gs = stats.goingSecond;
        var w = stats.wins, l = stats.losses, d = stats.draws, a = stats.abnormals;
        var wlDisplay = '<span class="wl-record"><span class="wins">' + w + '胜</span><span class="sep">-</span><span class="losses">' + l + '负</span>' +
          '<span class="sep">-</span><span class="draws">' + d + '平</span>' +
          '<span class="sep">-</span><span class="abnormals">' + a + '异常</span></span>';

        var dots = '';
        for (var i = 0; i < 10; i++) {
          var m = stats.last10[i];
          if (m && m.result === 'win') dots += '<span class="dot win"></span>';
          else if (m && m.result === 'loss') dots += '<span class="dot loss"></span>';
          else if (m && m.result === 'draw') dots += '<span class="dot draw"></span>';
          else if (m && m.result === 'abnormal') dots += '<span class="dot abnormal"></span>';
          else dots += '<span class="dot empty"></span>';
        }

        el.innerHTML =
          coinRow +
          '<div class="wl-row">' +
            wlDisplay +
            '<span class="wl-rate">' + stats.winRate + '<span class="pct">%</span></span>' +
          '</div>' +
          '<div class="detail-row">' +
            '<span class="item"><span class="lbl">先手</span><span class="v"><span style="color:#4cd964">' + gf.wins + '</span>-<span style="color:#ff3b30">' + gf.losses + '</span>-<span style="color:#ffd700">' + gf.draws + '</span>-<span style="color:#e8e8f0">' + gf.abnormals + '</span></span><span class="lbl">(' + gf.winRate + '%)</span></span>' +
            '<span class="item"><span class="lbl">后手</span><span class="v"><span style="color:#4cd964">' + gs.wins + '</span>-<span style="color:#ff3b30">' + gs.losses + '</span>-<span style="color:#ffd700">' + gs.draws + '</span>-<span style="color:#e8e8f0">' + gs.abnormals + '</span></span><span class="lbl">(' + gs.winRate + '%)</span></span>' +
            '<span class="item"><span class="lbl">总场数</span><span class="v">' + stats.total + '</span></span>' +
          '</div>' +
          '<div class="dots-row">' + dots + '<span class="dot-label">最近10场胜负情况</span></div>';
      }

      api.getStats().then(render);
      api.onStatsUpdate(render);

      document.getElementById('btn-close').addEventListener('click', function() { window.close(); });
    })();
  </script>
</body>
</html>
